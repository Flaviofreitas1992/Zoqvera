name: SEO custom domain migration

on:
  push:
    branches:
      - seo-custom-domain

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: seo-custom-domain
          fetch-depth: 0

      - name: Migrate URLs and add canonical tags
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          OLD = "https://flaviofreitas1992.github.io/Zoqvera"
          NEW = "https://zoqvera.com"

          def canonical_for(path: Path) -> str:
              rel = path.as_posix().lstrip("./")
              if rel == "index.html":
                  return f"{NEW}/"
              if path.name == "index.html":
                  parent = path.parent.as_posix().strip("/")
                  return f"{NEW}/{parent}/"
              return f"{NEW}/{rel}"

          html_files = sorted(Path(".").rglob("*.html"))
          if not html_files:
              raise SystemExit("No HTML files found")

          canonical_pattern = re.compile(
              r'<link\b(?=[^>]*\brel=["\']canonical["\'])[^>]*>',
              re.IGNORECASE,
          )
          og_url_pattern = re.compile(
              r'(<meta\b(?=[^>]*\bproperty=["\']og:url["\'])[^>]*\bcontent=["\'])([^"\']*)(["\'][^>]*>)',
              re.IGNORECASE,
          )

          for path in html_files:
              text = path.read_text(encoding="utf-8")
              text = text.replace(OLD, NEW)
              canonical = canonical_for(path)
              canonical_tag = f'<link rel="canonical" href="{canonical}">'

              if canonical_pattern.search(text):
                  text = canonical_pattern.sub(canonical_tag, text, count=1)
              elif "<!-- Open Graph -->" in text:
                  text = text.replace(
                      "<!-- Open Graph -->",
                      f'{canonical_tag}\n\n  <!-- Open Graph -->',
                      1,
                  )
              elif "</head>" in text:
                  text = text.replace(
                      "</head>",
                      f'  {canonical_tag}\n</head>',
                      1,
                  )
              else:
                  raise SystemExit(f"No </head> in {path}")

              def fix_og(match):
                  return f"{match.group(1)}{canonical}{match.group(3)}"

              text = og_url_pattern.sub(fix_og, text, count=1)
              path.write_text(text, encoding="utf-8")

          robots = Path("robots.txt")
          if robots.exists():
              robots.write_text(
                  "User-agent: *\nAllow: /\n\nSitemap: https://zoqvera.com/sitemap.xml\n",
                  encoding="utf-8",
              )

          sitemap = Path("sitemap.xml")
          if sitemap.exists():
              sitemap.write_text(
                  sitemap.read_text(encoding="utf-8").replace(OLD, NEW),
                  encoding="utf-8",
              )

          # Validation: no legacy GitHub Pages host remains in SEO-facing files.
          check_files = html_files + [p for p in (robots, sitemap) if p.exists()]
          leftovers = [str(p) for p in check_files if OLD in p.read_text(encoding="utf-8")]
          if leftovers:
              raise SystemExit("Legacy URL remains in: " + ", ".join(leftovers))

          # Validation: exactly one canonical per HTML file, matching its final URL.
          href_pattern = re.compile(
              r'<link\b(?=[^>]*\brel=["\']canonical["\'])[^>]*\bhref=["\']([^"\']+)["\'][^>]*>',
              re.IGNORECASE,
          )
          for path in html_files:
              text = path.read_text(encoding="utf-8")
              canonicals = href_pattern.findall(text)
              expected = canonical_for(path)
              if canonicals != [expected]:
                  raise SystemExit(
                      f"Canonical validation failed for {path}: {canonicals!r}, expected {expected!r}"
                  )
              og_match = og_url_pattern.search(text)
              if og_match and og_match.group(2) != expected:
                  raise SystemExit(
                      f"og:url mismatch for {path}: {og_match.group(2)!r}, expected {expected!r}"
                  )

          # Validation: sitemap is valid XML and only advertises the custom domain.
          if sitemap.exists():
              root = ET.parse(sitemap).getroot()
              ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              locs = [el.text.strip() for el in root.findall("sm:url/sm:loc", ns) if el.text]
              if not locs:
                  raise SystemExit("Sitemap contains no URLs")
              invalid = [url for url in locs if not url.startswith(f"{NEW}/")]
              if invalid:
                  raise SystemExit("Invalid sitemap URLs: " + ", ".join(invalid))
              print(f"Validated {len(locs)} sitemap URLs")

          print(f"Validated {len(html_files)} HTML canonical URLs")
          PY

      - name: Commit validated SEO migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/seo-custom-domain.yml
          git add -- '*.html' robots.txt sitemap.xml
          git diff --cached --check
          git commit -m "SEO: migrate canonical URLs to zoqvera.com"
          git push origin HEAD:seo-custom-domain
